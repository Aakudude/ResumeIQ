<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidate — ResumeIQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="shell"></div>
<div id="toasts"></div>
<script src="app.js"></script>
<script>
document.getElementById('app').innerHTML = sidebarHTML('candidates') + `
<main class="main"><div class="inner" id="inner">
  <div class="loader"><div class="spin"></div></div>
</div></main>`;

const id = new URLSearchParams(location.search).get('id');
if (!id) { location.href = 'candidates.html'; }

async function load() {
  const el = document.getElementById('inner');
  try {
    const c = await getCandidate(id);
    const sc = scoreColor(c.match_score);
    el.innerHTML = `
      <div class="row mb3"><a href="candidates.html" class="btn btn-ghost btn-sm">← Back to Candidates</a></div>
      <div class="card card-p mb3">
        <div class="row" style="gap:16px;align-items:flex-start">
          <div style="width:50px;height:50px;border-radius:var(--r);background:${sc}20;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:${sc};flex-shrink:0;border:1px solid ${sc}30">${c.name.charAt(0)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:19px;font-weight:700;color:var(--text);letter-spacing:-.3px">${c.name}</div>
            <div class="row mt1" style="flex-wrap:wrap;gap:14px">
              ${c.email ? `<span class="text-xs text-muted">✉ ${c.email}</span>` : ''}
              ${c.phone ? `<span class="text-xs text-muted">☎ ${c.phone}</span>` : ''}
              ${c.experience_years ? `<span class="text-xs text-muted">💼 ${c.experience_years} years exp</span>` : ''}
              ${c.education?.[0] ? `<span class="text-xs text-muted">🎓 ${c.education[0].degree}</span>` : ''}
            </div>
          </div>
          <div style="text-align:center;flex-shrink:0">
            <div class="score" style="width:52px;height:52px;font-size:13px;border-color:${sc};color:${sc};box-shadow:0 0 16px ${sc}30">${c.match_score != null ? c.match_score+'%' : '—'}</div>
            <div class="text-xs text-muted mt1">Match Score</div>
            ${c.rank ? `<div class="text-xs mono mt1" style="color:var(--brand2)">Rank #${c.rank}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="g2 mb3">
        <div class="card card-p">
          <div class="card-hd"><span class="card-title">Skills Detected (${c.extracted_skills.length})</span></div>
          <div class="wrap">${c.extracted_skills.map(s => c.matched_skills.includes(s) ? matchTag(s) : skillTag(s)).join(' ') || '<span class="text-muted text-xs">None detected</span>'}</div>
        </div>
        <div class="card card-p">
          <div class="card-hd"><span class="card-title">Missing Skills (${c.missing_skills.length})</span></div>
          <div class="wrap">${c.missing_skills.length
            ? c.missing_skills.map(missTag).join(' ')
            : `<p class="text-sm text-muted">${c.match_score != null ? '🎉 No required skills missing!' : 'Run matching to see gaps'}</p>`}</div>
        </div>
      </div>
      ${c.matched_skills.length || c.match_score != null ? `<div class="g2 mb3">
        ${c.matched_skills.length ? `<div class="card card-p">
          <div class="card-hd"><span class="card-title">Matched Skills (${c.matched_skills.length})</span></div>
          <div class="wrap">${c.matched_skills.map(matchTag).join(' ')}</div>
        </div>` : '<div></div>'}
        ${c.match_score != null ? `<div class="card card-p">
          <div class="card-hd"><span class="card-title">Match Breakdown</span></div>
          <div class="mb3">
            <div class="row-between mb2"><span class="text-soft text-sm">Overall Score</span><span class="mono bold" style="color:${sc}">${c.match_score}%</span></div>
            ${progBar(c.match_score, 100, sc)}
          </div>
          <div>
            <div class="row-between mb2"><span class="text-soft text-sm">Skills Match</span><span class="text-soft text-sm">${c.matched_skills.length} / ${c.matched_skills.length + c.missing_skills.length}</span></div>
            ${progBar(c.matched_skills.length, c.matched_skills.length + c.missing_skills.length || 1, 'var(--brand)')}
          </div>
        </div>` : ''}
      </div>` : ''}
      ${c.recommendations?.length ? `<div class="card card-p">
        <div class="card-hd"><span class="card-title">AI Recommendations</span></div>
        ${c.recommendations.map(r => `<div class="rec-item">${ICONS.spark}<span class="text-sm text-soft">${r}</span></div>`).join('')}
      </div>` : ''}`;
  } catch(e) {
    el.innerHTML = `<div class="row mb3"><a href="candidates.html" class="btn btn-ghost btn-sm">← Back</a></div><p class="text-muted" style="padding:20px">Candidate not found</p>`;
  }
}
load();
</script>
</body>
</html>
